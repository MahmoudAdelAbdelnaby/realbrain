<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Turn shared reels into structured knowledge.">
  <meta name="theme-color" content="#0E0F12">

  <!-- I1: added to the iPhone home screen, it opens full screen like an app. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Realbrain">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Realbrain</title>
  <style>
    /* The splash: the app's ground with the brain until Flutter paints. */
    html, body { margin: 0; height: 100%; background: #0E0F12; }
    #splash { position: fixed; inset: 0; display: grid; place-items: center; }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt=""></div>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('splash').remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
