name: reelbrain
description: Turn shared reels into structured knowledge.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  cloud_firestore: 7.1.0
  firebase_auth: 7.0.1
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: 8.3.2
  flutter_web_plugins:
    sdk: flutter
  latlong2: 0.10.1
  wakelock_plus: 1.8.2
  web: 1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Inter (OFL, assets/fonts/OFL-Inter.txt) + IBM Plex Sans Arabic (OFL, assets/fonts/OFL.txt):
  # design v4 (docs/DESIGN_V4_PROPOSAL.md).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
