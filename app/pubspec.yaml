name: reelbrain
description: Turn shared reels into structured knowledge.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  cloud_firestore: 7.1.0
  firebase_auth: 7.0.1
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: 8.3.2
  latlong2: 0.10.1
  wakelock_plus: 1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/liquid.frag
  # IBM Plex Sans + Plex Sans Arabic (OFL, assets/fonts/OFL.txt): Design system, P1-01.
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
